name: Historical V5 source capture

on:
  push:
    branches:
      - codex/v5-source-capture-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture original V5 serializer without gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    env:
      CAPTURE_DIR: Logs/Scenarios/V5Source/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      LUCKBOUND_V5_EXECUTION_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout historical tree and additive harness
        uses: actions/checkout@v7.0.1

      - name: Verify entire historical tree before capture
        id: source_before
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          proof = json.loads(pathlib.Path('.github/v5-source-capture/ORIGINAL-TREE-PROOF.json').read_text())
          assert proof['historicalCommit'] == 'a2590e141c46729e6efa7d01ea33647768b58711'
          assert proof['historicalTree'] == '658f45412efb0b6f554d6c458400116838369a97'
          originals = {row['path']: row for row in proof['files']}
          assert len(originals) == 4195
          allowed = {
            '.github/workflows/v5-source-capture.yml',
            '.github/v5-source-capture/CAPTURE-SCHEMA.json',
            '.github/v5-source-capture/ORIGINAL-TREE-PROOF.json',
            'Assets/Luckbound/Scripts/App/V5SourceCaptureFriend.cs',
            'Assets/Luckbound/Scripts/App/V5SourceCaptureFriend.cs.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureInputs.cs',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureInputs.cs.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureTests.cs',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureTests.cs.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/Luckbound.V5SourceCapture.Tests.asmdef',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/Luckbound.V5SourceCapture.Tests.asmdef.meta',
            'Tools/Automation/verify_v5_source_capture.py',
          }
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().rstrip('\0').split('\0'))
          assert tracked == set(originals) | allowed, sorted(tracked ^ (set(originals) | allowed))
          observed = {}
          detailed_inventory = []
          for relative in sorted(tracked):
              path = root / relative
              assert path.is_file() and not path.is_symlink(), relative
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if relative in originals:
                  row = originals[relative]
                  assert digest == row['sha256'] and len(raw) == row['bytes'], relative
                  blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  assert blob == row['gitBlobSha'], relative
              observed[relative] = digest
              detailed_inventory.append({'path': relative, 'type': 'file', 'bytes': len(raw), 'sha256': digest, 'gitBlobSha': hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest(), 'historicalGitBlobSha': originals[relative]['gitBlobSha'] if relative in originals else None})
          pathlib.Path('Logs').mkdir(exist_ok=True)
          pathlib.Path('Logs/V5-source-before.json').write_text(json.dumps(observed, indent=2) + '\n')
          pathlib.Path('Logs/V5-source-before-inventory.json').write_text(json.dumps(detailed_inventory, indent=2) + '\n')
          print(f'Verified {len(originals)} exact historical blobs and {len(allowed)} additive files.')
          PY

      - name: Verify physical symlink rejection on Linux
        shell: bash
        run: |
          python3 -B - <<'PY'
          import importlib.util, os, pathlib, sys, tempfile
          spec = importlib.util.spec_from_file_location('v5_capture_link_probe', 'Tools/Automation/verify_v5_source_capture.py')
          verifier = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = verifier
          spec.loader.exec_module(verifier)
          with tempfile.TemporaryDirectory(prefix='luckbound-v5-link-check-', dir=os.environ['RUNNER_TEMP']) as directory:
              root = pathlib.Path(directory)
              regular = root / 'regular.json'
              regular.write_bytes(b'{"synthetic":"path-validation-only"}')
              assert verifier.safe_file(root, 'regular.json') == regular
              (root / 'linked.json').symlink_to(regular.name)
              try:
                  verifier.safe_file(root, 'linked.json')
              except verifier.CaptureError as error:
                  assert 'Symlink/reparse point' in str(error), str(error)
              else:
                  raise AssertionError('Verifier accepted a physical symlink')
          print('Physical symlink rejection passed; synthetic path probe, no save capture or golden.')
          PY

      - name: Observe exact URP asset before Editor
        id: urp_before
        shell: bash
        run: |
          cat > Logs/V5UrpEvidenceHost.py <<'PY'
          """Read-only URP observation host; generated under Logs by the reviewed workflow."""
          import argparse
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          
          ASSET = "Assets/Settings/UniversalRenderPipelineGlobalSettings.asset"
          PROJECT_FILES = ("Packages/manifest.json", "Packages/packages-lock.json")
          PACKAGES = {"com.unity.render-pipelines.core", "com.unity.render-pipelines.universal"}
          
          
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          
          
          def regular(path):
              for candidate in (path, *path.parents):
                  info = candidate.lstat()
                  if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:
                      raise ValueError("Link/reparse path rejected: " + str(candidate))
              if not stat.S_ISREG(path.lstat().st_mode):
                  raise ValueError("Not a regular file: " + str(path))
              return path.read_bytes()
          
          
          def safe_child(root, relative):
              parts = PurePosixPath(relative)
              if parts.is_absolute() or any(p in ("", ".", "..") or ":" in p or "\\" in p for p in parts.parts):
                  raise ValueError("Unsafe relative path: " + relative)
              return root.joinpath(*parts.parts)
          
          
          def write_new(path, raw):
              path.parent.mkdir(parents=True, exist_ok=True)
              for parent in (path.parent, *path.parent.parents):
                  info = parent.lstat()
                  if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:
                      raise ValueError("Linked output parent rejected")
              with path.open("xb") as stream:
                  stream.write(raw)
          
          
          def encode(value):
              return (json.dumps(value, indent=2) + "\n").encode()
          
          
          def inventory(root):
              result = [{"path": ".", "type": "directory", "bytes": 0, "sha256": ""}]
              def visit(directory):
                  info = directory.lstat()
                  if not stat.S_ISDIR(info.st_mode) or stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:
                      raise ValueError("Package directory is not regular: " + str(directory))
                  for child in sorted(directory.iterdir()):
                      info = child.lstat()
                      relative = child.relative_to(root).as_posix()
                      if stat.S_ISLNK(info.st_mode) or getattr(info, "st_file_attributes", 0) & 0x400:
                          raise ValueError("Package link rejected: " + relative)
                      if stat.S_ISDIR(info.st_mode):
                          result.append({"path": relative, "type": "directory", "bytes": 0, "sha256": ""})
                          visit(child)
                      elif stat.S_ISREG(info.st_mode):
                          raw = regular(child)
                          result.append({"path": relative, "type": "file", "bytes": len(raw), "sha256": digest(raw)})
                      else:
                          raise ValueError("Unsupported package entry: " + relative)
              visit(root)
              return sorted(result, key=lambda row: row["path"])
          
          
          def normalized_inventory(rows):
              result = []
              seen = set()
              for row in rows:
                  if row["path"] in seen or row["type"] not in ("file", "directory"):
                      raise ValueError("Invalid or duplicate package entry")
                  seen.add(row["path"])
                  if row.get("status", "observed") not in ("observed", "observed-and-copied"):
                      raise ValueError("Incomplete package entry")
                  if row["type"] == "directory":
                      if row.get("bytes", 0) != 0 or row.get("sha256") not in (None, ""):
                          raise ValueError("Invalid directory observation")
                      result.append({"path": row["path"], "type": "directory", "bytes": 0, "sha256": ""})
                  else:
                      if type(row.get("bytes")) is not int or row["bytes"] < 0 or not re.fullmatch(r"[0-9a-f]{64}", row.get("sha256", "")):
                          raise ValueError("Invalid file observation")
                      result.append({key: row[key] for key in ("path", "type", "bytes", "sha256")})
              return sorted(result, key=lambda row: row["path"])
          
          
          def host_package_path(root, resolved):
              prefix = "/github/workspace/"
              if resolved.startswith(prefix):
                  return safe_child(root, resolved[len(prefix):])
              return None
          
          
          def check_editor(root, evidence, phase, identity, key):
              doc = json.loads(regular(evidence / ("editor-" + phase + ".json")))
              if doc["phase"] != phase or doc["runKeySha256"] != key or any(doc["run"].get(k) != v for k, v in identity.items()) or doc["run"].get("runIdentityComplete") is not True:
                  raise ValueError("Editor identity mismatch")
              if not doc["observationComplete"] or doc["errors"]:
                  raise ValueError("Editor observation incomplete: " + phase)
              if doc["invocationCountAtObservation"] != (0 if phase == "S1" else 24):
                  raise ValueError("Wrong invocation boundary")
              if doc["process"]["unityVersion"] != "6000.6.6f1" or doc["process"]["isBatchMode"] is not True:
                  raise ValueError("Wrong Editor environment")
              asset = doc["asset"]
              if asset["path"] != ASSET or asset["status"] != "observed":
                  raise ValueError("Asset observation missing")
              raw = regular(safe_child(evidence, asset["snapshotPath"]))
              if len(raw) != asset["bytes"] or digest(raw) != asset["sha256"]:
                  raise ValueError("Asset snapshot differs from observation")
              for assembly in doc["assemblies"]:
                  if assembly["status"] != "observed" or not assembly["location"] or not assembly["moduleVersionId"] or not re.fullmatch(r"[0-9a-f]{64}", assembly["sha256"]):
                      raise ValueError("Loaded assembly provenance incomplete")
              roles = {role for assembly in doc["assemblies"] for role in assembly["roles"]}
              if not {"URP", "Core", "Editor", "CoreModule", "JsonUtility"} <= roles:
                  raise ValueError("Required assembly role missing")
              for package in doc["packages"]:
                  if not package["inventoryComplete"] or package["status"] != "inventory-complete":
                      raise ValueError("Package observation incomplete")
                  entries = normalized_inventory(package["inventory"])
                  source_paths = set(package["copiedSourcePaths"])
                  if not source_paths or "package.json" not in source_paths:
                      raise ValueError("Package sources were not retained")
                  for relative in source_paths:
                      entry = next(item for item in entries if item["path"] == relative)
                      source = regular(safe_child(evidence, package["sourceSnapshotDirectory"] + "/" + relative))
                      if len(source) != entry["bytes"] or digest(source) != entry["sha256"]:
                          raise ValueError("Copied package source differs")
              if not PACKAGES <= {p["name"] for p in doc["packages"]}:
                  raise ValueError("Core/URP PackageInfo missing")
              project = {p["path"]: p for p in doc["projectFiles"]}
              if set(project) != set(PROJECT_FILES):
                  raise ValueError("Project package input inventory incomplete")
              for relative, item in project.items():
                  copied = regular(safe_child(evidence, "snapshots/" + phase + "/project/" + relative))
                  if len(copied) != item["bytes"] or digest(copied) != item["sha256"]:
                      raise ValueError("Copied project package input differs")
              return doc
          
          
          def observe(root, phase, commit, run_id, attempt):
              if not re.fullmatch(r"[0-9a-f]{40}", commit) or not run_id.isdecimal() or not attempt.isdecimal():
                  raise ValueError("Invalid host run identity")
              identity = {"executionCommit": commit, "runId": run_id, "runAttempt": attempt}
              key = digest(("luckbound-v5-urp-evidence-v1\n" + commit + "\n" + run_id + "\n" + attempt).encode())
              evidence = root / "Logs/V5UrpEvidence" / key
              result = {"schemaVersion": 1, "phase": phase, "run": identity, "runKeySha256": key, "observedAtUtc": datetime.now(timezone.utc).isoformat(), "hostHelperSha256": digest(Path(__file__).read_bytes()), "errors": [], "observationComplete": False}
              errors = result["errors"]
              try:
                  raw = regular(root / ASSET)
                  relative = "snapshots/" + phase + "/asset/" + ASSET
                  write_new(evidence / relative, raw)
                  result["asset"] = {"path": ASSET, "snapshotPath": relative, "bytes": len(raw), "sha256": digest(raw), "status": "observed"}
                  result["projectFiles"] = {rel: {"bytes": len(data), "sha256": digest(data)} for rel in PROJECT_FILES for data in [regular(root / rel)]}
              except (OSError, ValueError) as error:
                  errors.append({"stage": "host-observation", "reason": str(error)})
              if phase == "S3":
                  try:
                      s0 = json.loads(regular(evidence / "host-S0.json"))
                      if not s0["observationComplete"] or s0["run"] != identity:
                          raise ValueError("S0 absent, incomplete or mismatched")
                      s1 = check_editor(root, evidence, "S1", identity, key)
                      s2 = check_editor(root, evidence, "S2", identity, key)
                      if s0["projectFiles"] != result.get("projectFiles"):
                          raise ValueError("Project package inputs changed")
                      for editor in (s1, s2):
                          if {p["path"]: {k: p[k] for k in ("bytes", "sha256")} for p in editor["projectFiles"]} != s0["projectFiles"]:
                              raise ValueError("Project package inputs differ in Editor phase")
                      result["packages"] = []
                      for package in s2["packages"]:
                          earlier = next(p for p in s1["packages"] if p["packageId"] == package["packageId"])
                          before, after = normalized_inventory(earlier["inventory"]), normalized_inventory(package["inventory"])
                          if before != after or earlier["resolvedPath"] != package["resolvedPath"]:
                              raise ValueError("Package changed between S1/S2: " + package["name"])
                          host_path = host_package_path(root, package["resolvedPath"])
                          if host_path is None:
                              result["packages"].append({"name": package["name"], "status": "Unavailable", "resolvedPath": package["resolvedPath"]})
                              raise ValueError("Exact package root is unavailable after container exit: " + package["name"])
                          host_inventory = inventory(host_path)
                          if after != host_inventory:
                              raise ValueError("Package changed after Editor: " + package["name"])
                          result["packages"].append({"name": package["name"], "resolvedPath": package["resolvedPath"], "hostPath": str(host_path), "status": "observed", "inventory": host_inventory})
                      assembly_keys = ("assemblyName", "fullName", "location", "bytes", "sha256", "moduleVersionId", "packageId")
                      if [{k: a.get(k) for k in assembly_keys} for a in s1["assemblies"]] != [{k: a.get(k) for k in assembly_keys} for a in s2["assemblies"]]:
                          raise ValueError("Loaded assembly identities changed between S1/S2")
                      result["editorImageBinariesAfterExit"] = "Unavailable in host namespace; S1/S2 identities retained, no post-exit binary equality claimed"
                      result["fourCutAssetHashes"] = {"S0": s0["asset"]["sha256"], "S1": s1["asset"]["sha256"], "S2": s2["asset"]["sha256"], "S3": result["asset"]["sha256"]}
                      result["sourceIntegrityOverride"] = False
                  except (OSError, ValueError, KeyError, StopIteration) as error:
                      errors.append({"stage": "post-Editor-comparison", "reason": str(error)})
              result["observationComplete"] = not errors
              write_new(evidence / ("host-" + phase + ".json"), encode(result))
              print(json.dumps({"phase": phase, "runKey": key, "observationComplete": result["observationComplete"], "errors": errors}, indent=2))
              return result
          
          
          if __name__ == "__main__":
              parser = argparse.ArgumentParser()
              parser.add_argument("--phase", choices=("S0", "S3"), required=True)
              parser.add_argument("--project-root", type=Path, default=Path.cwd())
              parser.add_argument("--commit", required=True)
              parser.add_argument("--run-id", required=True)
              parser.add_argument("--attempt", required=True)
              args = parser.parse_args()
              report = observe(args.project_root.resolve(), args.phase, args.commit, args.run_id, args.attempt)
              raise SystemExit(0 if report["observationComplete"] else 1)
          PY
          python3 -B Logs/V5UrpEvidenceHost.py --phase S0 --project-root "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Run only historical serializer capture tests
        id: capture
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          cliVersion: v0.1.72
          customImage: unityci/editor:ubuntu-6000.6.6f1-base-3.2.2
          testMode: editmode
          customParameters: '-testFilter Luckbound.Tests.V5SourceCapture.V5SourceCaptureTests -luckboundV5CaptureDir ${{ env.CAPTURE_DIR }} -nographics'
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Historical V5 source capture

      - name: Observe URP asset and packages after Editor
        id: urp_after
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 -B Logs/V5UrpEvidenceHost.py --phase S3 --project-root "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      - name: Verify entire source tree remains unchanged
        id: source_after
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import difflib, hashlib, json, os, pathlib, stat, subprocess
          
          root = pathlib.Path.cwd()
          before_file = pathlib.Path('Logs/V5-source-before.json')
          before_inventory = pathlib.Path('Logs/V5-source-before-inventory.json')
          original = json.loads(before_file.read_text())
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().rstrip('\0').split('\0'))
          identity = {name: os.environ.get(name) for name in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          identity_slug = '-'.join(identity.get(name) or 'offline' for name in identity)
          evidence = pathlib.Path('Logs/V5SourceIntegrity') / identity_slug
          observed, changes, source_paths, scan_errors = {}, [], set(), []
          
          def reparse(info):
              return stat.S_ISLNK(info.st_mode) or bool(getattr(info, 'st_file_attributes', 0) & 0x400)
          
          def inspect(relative):
              path = root / relative
              for ancestor in reversed(path.parents):
                  if ancestor == root or root not in ancestor.parents:
                      continue
                  info = ancestor.lstat()
                  if reparse(info):
                      return {'status': 'typeChanged', 'type': 'linked-ancestor', 'linkPath': ancestor.relative_to(root).as_posix(), 'linkTarget': os.readlink(ancestor)}, None
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  return {'status': 'missing', 'type': 'absent'}, None
              if reparse(info):
                  return {'status': 'typeChanged', 'type': 'link', 'linkTarget': os.readlink(path)}, None
              if not stat.S_ISREG(info.st_mode):
                  return {'status': 'typeChanged', 'type': 'directory' if stat.S_ISDIR(info.st_mode) else 'other'}, None
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              return {'status': 'unchanged' if digest == original.get(relative) else 'changed', 'type': 'file', 'bytes': len(raw), 'sha256': digest}, raw
          
          for source_root in ('Assets', 'Packages', 'ProjectSettings'):
              top = root / source_root
              try:
                  top_info = top.lstat()
                  if reparse(top_info) or not stat.S_ISDIR(top_info.st_mode):
                      source_paths.add(source_root)
                      continue
              except OSError as error:
                  source_paths.add(source_root)
                  scan_errors.append({'path': source_root, 'error': str(error)})
                  continue
              def scan_error(error):
                  scan_errors.append({'path': os.path.relpath(error.filename, root).replace('\\', '/'), 'error': str(error)})
              for directory, directories, files in os.walk(root / source_root, followlinks=False, onerror=scan_error):
                  for name in files + directories[:]:
                      path = pathlib.Path(directory) / name
                      try:
                          info = path.lstat()
                          if reparse(info) or not stat.S_ISDIR(info.st_mode):
                              source_paths.add(path.relative_to(root).as_posix())
                          if reparse(info) and name in directories:
                              directories.remove(name)
                      except OSError as error:
                          scan_errors.append({'path': path.relative_to(root).as_posix(), 'error': str(error)})
          
          for relative in sorted(set(original) | tracked | source_paths):
              raw = None
              try:
                  record, raw = inspect(relative)
              except OSError as error:
                  record = {'status': 'unreadable', 'type': 'unknown', 'error': str(error)}
              record.update({'path': relative, 'beforeSha256': original.get(relative), 'trackedAfter': relative in tracked})
              if relative not in original:
                  record['status'] = 'added' if record['type'] == 'file' else record['status']
              elif relative not in tracked:
                  record['status'] = 'no-longer-tracked'
              observed[relative] = dict(record)
              if record['status'] == 'unchanged':
                  continue
              before = None
              if relative in original:
                  try:
                      before = subprocess.check_output(['git', 'show', 'HEAD:' + relative])
                      record['beforeEvidenceMatchesPreflight'] = hashlib.sha256(before).hexdigest() == original[relative]
                      before_path = evidence / 'before' / relative
                      before_path.parent.mkdir(parents=True, exist_ok=True)
                      before_path.write_bytes(before)
                      record['beforeBytes'] = len(before)
                      record['beforeEvidence'] = before_path.as_posix()
                  except (OSError, subprocess.CalledProcessError) as error:
                      record['beforeEvidenceError'] = str(error)
              if raw is not None:
                  try:
                      after_path = evidence / 'after' / relative
                      after_path.parent.mkdir(parents=True, exist_ok=True)
                      after_path.write_bytes(raw)
                      record['afterEvidence'] = after_path.as_posix()
                  except OSError as error:
                      record['afterEvidenceError'] = str(error)
              if before is not None and raw is not None:
                  record['firstDifferenceByte'] = next((index for index, pair in enumerate(zip(before, raw)) if pair[0] != pair[1]), min(len(before), len(raw)))
                  try:
                      before_text, after_text = before.decode('utf-8'), raw.decode('utf-8')
                  except UnicodeDecodeError:
                      record['diffKind'] = 'binary; exact before and after preserved'
                  else:
                      try:
                          diff_path = evidence / 'diff' / (relative + '.diff')
                          diff_path.parent.mkdir(parents=True, exist_ok=True)
                          diff = ''.join(difflib.unified_diff(before_text.splitlines(keepends=True), after_text.splitlines(keepends=True), fromfile='before/' + relative, tofile='after/' + relative))
                          diff_path.write_text(diff, encoding='utf-8')
                          record['diffKind'], record['diffEvidence'] = 'utf-8 unified diff', diff_path.as_posix()
                      except OSError as error:
                          record['diffEvidenceError'] = str(error)
              changes.append(record)
          
          after_file = pathlib.Path('Logs/V5-source-after.json')
          after_file.write_text(json.dumps(observed, indent=2) + '\n')
          errors = scan_errors + [change for change in changes if change['status'] == 'unreadable' or any(key.endswith('Error') for key in change) or change.get('beforeEvidenceMatchesPreflight') is False]
          complete = not errors and before_inventory.is_file()
          integrity = complete and not changes and tracked == set(original)
          summary = {'schemaVersion': 2, 'identity': identity, 'trackedBefore': len(original), 'trackedAfter': len(tracked), 'observedPaths': len(observed), 'changedOrInvalid': len(changes), 'beforeSnapshotSha256': hashlib.sha256(before_file.read_bytes()).hexdigest(), 'beforeInventorySha256': hashlib.sha256(before_inventory.read_bytes()).hexdigest() if before_inventory.is_file() else None, 'afterInventorySha256': hashlib.sha256(after_file.read_bytes()).hexdigest(), 'missingTracked': sorted(set(original) - tracked), 'newTracked': sorted(tracked - set(original)), 'untrackedSourcePaths': sorted(source_paths - tracked), 'scanErrors': scan_errors, 'changes': changes, 'evidenceComplete': complete, 'sourceIntegrity': integrity, 'allTrackedBytesUnchanged': integrity}
          pathlib.Path('Logs/V5-source-differences.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          if not integrity:
              raise SystemExit('Historical source proof FAILED after preserving all observations; diagnostic output is not an accepted capture.')
          print(f'All {len(original)} tracked files remain byte-identical after Unity; no unauthorized source additions.')
          PY

      - name: Verify original serializer capture artifact
        id: verify_capture
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        shell: bash
        run: |
          python3 Tools/Automation/verify_v5_source_capture.py \
            --capture-dir "$CAPTURE_DIR" \
            --xml test-results/editmode-results.xml \
            --commit "$GITHUB_SHA" \
            --project-root "$GITHUB_WORKSPACE" \
            --schema .github/v5-source-capture/CAPTURE-SCHEMA.json \
            > Logs/V5CaptureVerification.json
          cat Logs/V5CaptureVerification.json

      - name: Require tests, source proofs and capture verification
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SOURCE_BEFORE: ${{ steps.source_before.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          SOURCE_AFTER: ${{ steps.source_after.outcome }}
          VERIFIER: ${{ steps.verify_capture.outcome }}
          URP_BEFORE: ${{ steps.urp_before.outcome }}
          URP_AFTER: ${{ steps.urp_after.outcome }}
        run: |
          test "$SOURCE_BEFORE" = success
          test "$CAPTURE" = success
          test "$SOURCE_AFTER" = success
          test "$VERIFIER" = success
          test "$URP_BEFORE" = success
          test "$URP_AFTER" = success

      - name: Preserve XML, logs, capture and source proofs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v5-source-capture-${{ github.sha }}
          path: |
            test-results
            Logs/Scenarios
            Logs/V5-source-before.json
            Logs/V5-source-after.json
            Logs/V5CaptureVerification.json
            Logs/V5-source-before-inventory.json
            Logs/V5-source-differences.json
            Logs/V5SourceIntegrity
            Logs/V5UrpEvidence
            Logs/V5UrpEvidenceHost.py
          if-no-files-found: error
          retention-days: 30
