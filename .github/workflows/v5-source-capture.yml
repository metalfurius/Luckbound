name: Historical V5 source capture

on:
  push:
    branches:
      - codex/v5-source-capture-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture original V5 serializer without gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    env:
      CAPTURE_DIR: Logs/Scenarios/V5Source/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      LUCKBOUND_V5_EXECUTION_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout historical tree and additive harness
        uses: actions/checkout@v7.0.1

      - name: Verify entire historical tree before capture
        id: source_before
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd()
          proof = json.loads(pathlib.Path('.github/v5-source-capture/ORIGINAL-TREE-PROOF.json').read_text())
          assert proof['historicalCommit'] == 'a2590e141c46729e6efa7d01ea33647768b58711'
          assert proof['historicalTree'] == '658f45412efb0b6f554d6c458400116838369a97'
          originals = {row['path']: row for row in proof['files']}
          assert len(originals) == 4195
          allowed = {
            '.github/workflows/v5-source-capture.yml',
            '.github/v5-source-capture/CAPTURE-SCHEMA.json',
            '.github/v5-source-capture/ORIGINAL-TREE-PROOF.json',
            'Assets/Luckbound/Scripts/App/V5SourceCaptureFriend.cs',
            'Assets/Luckbound/Scripts/App/V5SourceCaptureFriend.cs.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureInputs.cs',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureInputs.cs.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureTests.cs',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/V5SourceCaptureTests.cs.meta',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/Luckbound.V5SourceCapture.Tests.asmdef',
            'Assets/Luckbound/Tests/EditMode/V5SourceCapture/Luckbound.V5SourceCapture.Tests.asmdef.meta',
            'Tools/Automation/verify_v5_source_capture.py',
          }
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().rstrip('\0').split('\0'))
          assert tracked == set(originals) | allowed, sorted(tracked ^ (set(originals) | allowed))
          observed = {}
          detailed_inventory = []
          for relative in sorted(tracked):
              path = root / relative
              assert path.is_file() and not path.is_symlink(), relative
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              if relative in originals:
                  row = originals[relative]
                  assert digest == row['sha256'] and len(raw) == row['bytes'], relative
                  blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  assert blob == row['gitBlobSha'], relative
              observed[relative] = digest
              detailed_inventory.append({'path': relative, 'type': 'file', 'bytes': len(raw), 'sha256': digest, 'gitBlobSha': hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest(), 'historicalGitBlobSha': originals[relative]['gitBlobSha'] if relative in originals else None})
          pathlib.Path('Logs').mkdir(exist_ok=True)
          pathlib.Path('Logs/V5-source-before.json').write_text(json.dumps(observed, indent=2) + '\n')
          pathlib.Path('Logs/V5-source-before-inventory.json').write_text(json.dumps(detailed_inventory, indent=2) + '\n')
          print(f'Verified {len(originals)} exact historical blobs and {len(allowed)} additive files.')
          PY

      - name: Verify physical symlink rejection on Linux
        shell: bash
        run: |
          python3 -B - <<'PY'
          import importlib.util, os, pathlib, sys, tempfile
          spec = importlib.util.spec_from_file_location('v5_capture_link_probe', 'Tools/Automation/verify_v5_source_capture.py')
          verifier = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = verifier
          spec.loader.exec_module(verifier)
          with tempfile.TemporaryDirectory(prefix='luckbound-v5-link-check-', dir=os.environ['RUNNER_TEMP']) as directory:
              root = pathlib.Path(directory)
              regular = root / 'regular.json'
              regular.write_bytes(b'{"synthetic":"path-validation-only"}')
              assert verifier.safe_file(root, 'regular.json') == regular
              (root / 'linked.json').symlink_to(regular.name)
              try:
                  verifier.safe_file(root, 'linked.json')
              except verifier.CaptureError as error:
                  assert 'Symlink/reparse point' in str(error), str(error)
              else:
                  raise AssertionError('Verifier accepted a physical symlink')
          print('Physical symlink rejection passed; synthetic path probe, no save capture or golden.')
          PY

      - name: Run only historical serializer capture tests
        id: capture
        uses: game-ci/unity-test-runner@v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GAME_CI_COVERAGE_ENABLED: 'false'
        with:
          cliVersion: v0.1.72
          customImage: unityci/editor:ubuntu-6000.6.6f1-base-3.2.2
          testMode: editmode
          customParameters: '-testFilter Luckbound.Tests.V5SourceCapture.V5SourceCaptureTests -luckboundV5CaptureDir ${{ env.CAPTURE_DIR }} -nographics'
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Historical V5 source capture

      - name: Verify entire source tree remains unchanged
        id: source_after
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import difflib, hashlib, json, os, pathlib, stat, subprocess
          
          root = pathlib.Path.cwd()
          before_file = pathlib.Path('Logs/V5-source-before.json')
          before_inventory = pathlib.Path('Logs/V5-source-before-inventory.json')
          original = json.loads(before_file.read_text())
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().rstrip('\0').split('\0'))
          identity = {name: os.environ.get(name) for name in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          identity_slug = '-'.join(identity.get(name) or 'offline' for name in identity)
          evidence = pathlib.Path('Logs/V5SourceIntegrity') / identity_slug
          observed, changes, source_paths, scan_errors = {}, [], set(), []
          
          def reparse(info):
              return stat.S_ISLNK(info.st_mode) or bool(getattr(info, 'st_file_attributes', 0) & 0x400)
          
          def inspect(relative):
              path = root / relative
              for ancestor in reversed(path.parents):
                  if ancestor == root or root not in ancestor.parents:
                      continue
                  info = ancestor.lstat()
                  if reparse(info):
                      return {'status': 'typeChanged', 'type': 'linked-ancestor', 'linkPath': ancestor.relative_to(root).as_posix(), 'linkTarget': os.readlink(ancestor)}, None
              try:
                  info = path.lstat()
              except FileNotFoundError:
                  return {'status': 'missing', 'type': 'absent'}, None
              if reparse(info):
                  return {'status': 'typeChanged', 'type': 'link', 'linkTarget': os.readlink(path)}, None
              if not stat.S_ISREG(info.st_mode):
                  return {'status': 'typeChanged', 'type': 'directory' if stat.S_ISDIR(info.st_mode) else 'other'}, None
              raw = path.read_bytes()
              digest = hashlib.sha256(raw).hexdigest()
              return {'status': 'unchanged' if digest == original.get(relative) else 'changed', 'type': 'file', 'bytes': len(raw), 'sha256': digest}, raw
          
          for source_root in ('Assets', 'Packages', 'ProjectSettings'):
              top = root / source_root
              try:
                  top_info = top.lstat()
                  if reparse(top_info) or not stat.S_ISDIR(top_info.st_mode):
                      source_paths.add(source_root)
                      continue
              except OSError as error:
                  source_paths.add(source_root)
                  scan_errors.append({'path': source_root, 'error': str(error)})
                  continue
              def scan_error(error):
                  scan_errors.append({'path': os.path.relpath(error.filename, root).replace('\\', '/'), 'error': str(error)})
              for directory, directories, files in os.walk(root / source_root, followlinks=False, onerror=scan_error):
                  for name in files + directories[:]:
                      path = pathlib.Path(directory) / name
                      try:
                          info = path.lstat()
                          if reparse(info) or not stat.S_ISDIR(info.st_mode):
                              source_paths.add(path.relative_to(root).as_posix())
                          if reparse(info) and name in directories:
                              directories.remove(name)
                      except OSError as error:
                          scan_errors.append({'path': path.relative_to(root).as_posix(), 'error': str(error)})
          
          for relative in sorted(set(original) | tracked | source_paths):
              raw = None
              try:
                  record, raw = inspect(relative)
              except OSError as error:
                  record = {'status': 'unreadable', 'type': 'unknown', 'error': str(error)}
              record.update({'path': relative, 'beforeSha256': original.get(relative), 'trackedAfter': relative in tracked})
              if relative not in original:
                  record['status'] = 'added' if record['type'] == 'file' else record['status']
              elif relative not in tracked:
                  record['status'] = 'no-longer-tracked'
              observed[relative] = dict(record)
              if record['status'] == 'unchanged':
                  continue
              before = None
              if relative in original:
                  try:
                      before = subprocess.check_output(['git', 'show', 'HEAD:' + relative])
                      record['beforeEvidenceMatchesPreflight'] = hashlib.sha256(before).hexdigest() == original[relative]
                      before_path = evidence / 'before' / relative
                      before_path.parent.mkdir(parents=True, exist_ok=True)
                      before_path.write_bytes(before)
                      record['beforeBytes'] = len(before)
                      record['beforeEvidence'] = before_path.as_posix()
                  except (OSError, subprocess.CalledProcessError) as error:
                      record['beforeEvidenceError'] = str(error)
              if raw is not None:
                  try:
                      after_path = evidence / 'after' / relative
                      after_path.parent.mkdir(parents=True, exist_ok=True)
                      after_path.write_bytes(raw)
                      record['afterEvidence'] = after_path.as_posix()
                  except OSError as error:
                      record['afterEvidenceError'] = str(error)
              if before is not None and raw is not None:
                  record['firstDifferenceByte'] = next((index for index, pair in enumerate(zip(before, raw)) if pair[0] != pair[1]), min(len(before), len(raw)))
                  try:
                      before_text, after_text = before.decode('utf-8'), raw.decode('utf-8')
                  except UnicodeDecodeError:
                      record['diffKind'] = 'binary; exact before and after preserved'
                  else:
                      try:
                          diff_path = evidence / 'diff' / (relative + '.diff')
                          diff_path.parent.mkdir(parents=True, exist_ok=True)
                          diff = ''.join(difflib.unified_diff(before_text.splitlines(keepends=True), after_text.splitlines(keepends=True), fromfile='before/' + relative, tofile='after/' + relative))
                          diff_path.write_text(diff, encoding='utf-8')
                          record['diffKind'], record['diffEvidence'] = 'utf-8 unified diff', diff_path.as_posix()
                      except OSError as error:
                          record['diffEvidenceError'] = str(error)
              changes.append(record)
          
          after_file = pathlib.Path('Logs/V5-source-after.json')
          after_file.write_text(json.dumps(observed, indent=2) + '\n')
          errors = scan_errors + [change for change in changes if change['status'] == 'unreadable' or any(key.endswith('Error') for key in change) or change.get('beforeEvidenceMatchesPreflight') is False]
          complete = not errors and before_inventory.is_file()
          integrity = complete and not changes and tracked == set(original)
          summary = {'schemaVersion': 2, 'identity': identity, 'trackedBefore': len(original), 'trackedAfter': len(tracked), 'observedPaths': len(observed), 'changedOrInvalid': len(changes), 'beforeSnapshotSha256': hashlib.sha256(before_file.read_bytes()).hexdigest(), 'beforeInventorySha256': hashlib.sha256(before_inventory.read_bytes()).hexdigest() if before_inventory.is_file() else None, 'afterInventorySha256': hashlib.sha256(after_file.read_bytes()).hexdigest(), 'missingTracked': sorted(set(original) - tracked), 'newTracked': sorted(tracked - set(original)), 'untrackedSourcePaths': sorted(source_paths - tracked), 'scanErrors': scan_errors, 'changes': changes, 'evidenceComplete': complete, 'sourceIntegrity': integrity, 'allTrackedBytesUnchanged': integrity}
          pathlib.Path('Logs/V5-source-differences.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          if not integrity:
              raise SystemExit('Historical source proof FAILED after preserving all observations; diagnostic output is not an accepted capture.')
          print(f'All {len(original)} tracked files remain byte-identical after Unity; no unauthorized source additions.')
          PY

      - name: Verify original serializer capture artifact
        id: verify_capture
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        shell: bash
        run: |
          python3 Tools/Automation/verify_v5_source_capture.py \
            --capture-dir "$CAPTURE_DIR" \
            --xml test-results/editmode-results.xml \
            --commit "$GITHUB_SHA" \
            --project-root "$GITHUB_WORKSPACE" \
            --schema .github/v5-source-capture/CAPTURE-SCHEMA.json \
            > Logs/V5CaptureVerification.json
          cat Logs/V5CaptureVerification.json

      - name: Require tests, source proofs and capture verification
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SOURCE_BEFORE: ${{ steps.source_before.outcome }}
          CAPTURE: ${{ steps.capture.outcome }}
          SOURCE_AFTER: ${{ steps.source_after.outcome }}
          VERIFIER: ${{ steps.verify_capture.outcome }}
        run: |
          test "$SOURCE_BEFORE" = success
          test "$CAPTURE" = success
          test "$SOURCE_AFTER" = success
          test "$VERIFIER" = success

      - name: Preserve XML, logs, capture and source proofs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: v5-source-capture-${{ github.sha }}
          path: |
            test-results
            Logs/Scenarios
            Logs/V5-source-before.json
            Logs/V5-source-after.json
            Logs/V5CaptureVerification.json
            Logs/V5-source-before-inventory.json
            Logs/V5-source-differences.json
            Logs/V5SourceIntegrity
          if-no-files-found: error
          retention-days: 30
