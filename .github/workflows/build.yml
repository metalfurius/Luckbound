# Candidate content for .github/workflows/build.yml ONLY on the diagnostic
# branch. Never merge or apply this replacement to Main.
name: F10 V6 Linux Diagnostic
run-name: F10 Linux diagnostic (${{ inputs.diagnostic_mode }})

on:
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: Internal diagnostic operation
        required: false
        default: acceptance
        type: choice
        options:
          - acceptance
          - framework-source
          - v7-export

permissions:
  contents: read

jobs:
  f10-v6-linux-acceptance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/luckbound-f10-linux-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout the selected diagnostic commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Capture the pinned image Test Framework source
        if: inputs.diagnostic_mode == 'framework-source'
        shell: bash
        env:
          F10_IMAGE: unityci/editor:ubuntu-6000.6.10f1-base-4.0.0@sha256:b298e645b9982ee48dbcb90b77f900e82afd7eb59daf9512ed5a5220ee6911d5
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/f10-v6-linux-evidence"
          test ! -e "$evidence"
          mkdir -p "$evidence/framework-source"
          printf '%s\n' "$F10_IMAGE" > "$evidence/framework-source/IMAGE.txt"
          docker pull "$F10_IMAGE"
          docker run --rm --read-only --network=none \
            --mount "type=bind,src=$evidence/framework-source,dst=/evidence" \
            --entrypoint /bin/sh "$F10_IMAGE" -c '
              set -eu
              package=/opt/unity/Editor/Data/Resources/PackageManager/BuiltInPackages/com.unity.test-framework
              script="$package/UnityEngine.TestRunner/TestRunner/PlaymodeTestsController.cs"
              test -f "$package/package.json"
              test -f "$script"
              test ! -L "$script"
              test -f "$script.meta"
              test ! -L "$script.meta"
              cp -- "$package/package.json" /evidence/package.json
              cp -- "$script" /evidence/PlaymodeTestsController.cs
              cp -- "$script.meta" /evidence/PlaymodeTestsController.cs.meta
              cd /evidence
              sha256sum package.json PlaymodeTestsController.cs PlaymodeTestsController.cs.meta > SHA256SUMS
            '

      - name: Run the frozen diagnostic in one container
        if: inputs.diagnostic_mode != 'framework-source' && inputs.diagnostic_mode != 'v7-export'
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          F10_IMAGE: unityci/editor:ubuntu-6000.6.10f1-base-4.0.0@sha256:b298e645b9982ee48dbcb90b77f900e82afd7eb59daf9512ed5a5220ee6911d5
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/ci/f10-linux"
          evidence="$RUNNER_TEMP/f10-v6-linux-evidence"
          test -d "$payload/tools"
          test -d "$payload/overlays"
          test -f "$payload/linux-overlay-manifest.json"
          test ! -e "$evidence"
          mkdir "$evidence"
          docker pull "$F10_IMAGE"
          docker run --rm --init --shm-size=2g \
            --mount "type=bind,src=$payload,dst=/luckbound,readonly" \
            --mount "type=bind,src=$evidence,dst=/tmp/luckbound-run/evidence" \
            -e UNITY_LICENSE -e UNITY_EMAIL -e UNITY_PASSWORD \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW \
            -e GITHUB_WORKFLOW_REF -e GITHUB_JOB -e RUNNER_OS -e RUNNER_ENVIRONMENT \
            -e GITHUB_WORKSPACE=/luckbound -e RUNNER_TEMP=/tmp/luckbound-run \
            -e LUCKBOUND_F10_LINUX_PROJECT_ROOT=/tmp/luckbound-run/project \
            --entrypoint /bin/bash "$F10_IMAGE" \
            /luckbound/tools/container_entrypoint.sh \
            --workspace /luckbound \
            --source-zip /luckbound/input/source.zip \
            --source-inventory /luckbound/input/source-inventory.json \
            --linux-manifest /luckbound/linux-overlay-manifest.json \
            --overlay-root /luckbound/overlays \
            --temp-root /tmp/luckbound-run \
            --project-root /tmp/luckbound-run/project \
            --state /tmp/luckbound-run/state.json \
            --unity-editor /opt/unity/Editor/Unity \
            --results-root /tmp/luckbound-run/evidence/results

      - name: Export the SHA-pinned V7 physical inputs in one container
        if: inputs.diagnostic_mode == 'v7-export'
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          F10_IMAGE: unityci/editor:ubuntu-6000.6.10f1-base-4.0.0@sha256:b298e645b9982ee48dbcb90b77f900e82afd7eb59daf9512ed5a5220ee6911d5
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/ci/f10-linux"
          evidence="$RUNNER_TEMP/f10-v7-linux-evidence"
          test -d "$payload/v7-tools"
          test -d "$payload/v7-overlays"
          test -f "$payload/linux-v7-overlay-manifest.json"
          test ! -e "$evidence"
          mkdir "$evidence"
          docker pull "$F10_IMAGE"
          docker run --rm --init --shm-size=2g \
            --mount "type=bind,src=$payload,dst=/luckbound,readonly" \
            --mount "type=bind,src=$evidence,dst=/tmp/luckbound-run/evidence" \
            -e UNITY_LICENSE -e UNITY_EMAIL -e UNITY_PASSWORD \
            -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF \
            -e GITHUB_RUN_ID -e GITHUB_RUN_ATTEMPT -e GITHUB_WORKFLOW \
            -e GITHUB_WORKFLOW_REF -e GITHUB_JOB -e RUNNER_OS -e RUNNER_ENVIRONMENT \
            -e GITHUB_WORKSPACE=/luckbound -e RUNNER_TEMP=/tmp/luckbound-run \
            -e LUCKBOUND_F10_LINUX_PROJECT_ROOT=/tmp/luckbound-run/project \
            --entrypoint /bin/bash "$F10_IMAGE" \
            /luckbound/v7-tools/container_entrypoint.sh \
            --workspace /luckbound \
            --source-zip /luckbound/input/source.zip \
            --source-inventory /luckbound/input/source-inventory.json \
            --route v7-export \
            --v7-linux-manifest /luckbound/linux-v7-overlay-manifest.json \
            --v7-linux-manifest-sha256 dbe274ac2b45a4b34fc70119c2930fca035cdbe47efc221e0d077a21b0933101 \
            --overlay-root /luckbound/v7-overlays \
            --temp-root /tmp/luckbound-run \
            --project-root /tmp/luckbound-run/project \
            --state /tmp/luckbound-run/state.json \
            --unity-editor /opt/unity/Editor/Unity \
            --results-root /tmp/luckbound-run/evidence/results

      - name: Preserve diagnostic results
        if: always() && inputs.diagnostic_mode != 'v7-export'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: f10-v6-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f10-v6-linux-evidence
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve V7 export results
        if: always() && inputs.diagnostic_mode == 'v7-export'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: f10-v7-linux-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f10-v7-linux-evidence
          if-no-files-found: warn
          retention-days: 7
